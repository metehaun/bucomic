<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUKomik</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background-color: #0b0f19; /* Koyu lacivert/siyah arka plan */
            color: #ffffff; /* Beyaz ana metin */
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* Üst alan (Sol logo, Sağ menü) */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .logo img {
            height: 80px;
            width: auto;
            display: block;
            cursor: pointer;
            filter: drop-shadow(0 0 8px rgba(0, 102, 255, 0.3)); /* Logoya hafif mavi parlama */
        }
        .nav-container {
            display: flex;
            gap: 10px;
        }
        .nav-btn {
            text-decoration: none;
            color: #9cb3c9; /* Açık mavi/gri yazı */
            border: 1px solid #1e293b; /* Koyu lacivert çerçeve */
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.2s;
            cursor: pointer;
            background: #111827; /* Koyu siyah/mavi buton arka planı */
            outline: none;
        }
        .nav-btn:hover {
            background-color: #0066ff; /* Parlak mavi hover */
            color: #ffffff;
            border-color: #0066ff;
            box-shadow: 0 0 12px rgba(0, 102, 255, 0.5);
        }
        .nav-btn.active {
            background-color: #0066ff; /* Aktif buton mavi */
            color: #ffffff;
            border-color: #0066ff;
        }

        /* Sayfa geçişleri için kapsayıcı */
        .page-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* Varsayılan olarak tüm sayfaları gizle */
        .page {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            animation: fadeIn 0.3s ease;
        }

        /* Aktif olan sayfayı göster */
        .page.active {
            display: flex;
        }

        /* Sayfa 1 stili */
        #page1 h1 {
            font-size: 10vw;
            font-weight: 900;
            letter-spacing: -2px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 102, 255, 0.4); /* Yazıya mavi gölge */
            margin: 0;
        }

        /* Sayfa 2 ve Sayfa 3 stili */
        .page h2 {
            font-size: 5vw;
            font-weight: 900;
            margin-bottom: 20px;
            color: #0066ff; /* Başlıklar parlak mavi */
        }
        .page img.komik-resim {
            max-width: 90%;
            max-height: 60vh;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 102, 255, 0.2); /* Görsele mavi gölge */
            border: 1px solid #1e293b;
        }
        
        /* YouTube iframe stili */
        .video-container {
            width: 100%;
            max-width: 640px;
            aspect-ratio: 16 / 9;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .video-container iframe {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 102, 255, 0.2); /* Videoya mavi gölge */
            border: 1px solid #1e293b;
        }

        footer {
            font-size: 12px;
            color: #4b5563; /* Koyu gri alt yazı */
            z-index: 10;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Üst Başlık (Logo ve Menü) -->
    <header>
        <!-- Logoya tıklandığında anasayfa (page1) açılır -->
        <div class="logo" onclick="showPage('page1')">
            <img src="logo.png" alt="Logo">
        </div>
        <!-- Menü alanı -->
        <div class="nav-container">
            <button class="nav-btn" id="btn-page2" onclick="showPage('page2')">Gerçekten Komik</button>
            <button class="nav-btn" id="btn-page3" onclick="showPage('page3')">Bu da Çok İyi</button>
        </div>
    </header>

    <!-- Tek Dosyadaki Tüm Sayfalar -->
    <div class="page-container">
        
        <!-- SAYFA 1 -->
        <div id="page1" class="page active">
            <h1>bu komik</h1>
        </div>

        <!-- SAYFA 2 -->
        <div id="page2" class="page">
            <h2>bu gerçekten komik</h2>
            <img class="komik-resim" src="komik.jpeg" alt="Komik Fotoğraf">
        </div>

        <!-- SAYFA 3 -->
        <div id="page3" class="page">
            <h2>bu da çok iyi</h2>
            <!-- YouTube Embed Alanı -->
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/Ui-L23fcjDQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>

    </div>

    <!-- Alt Bilgi -->
    <footer>hiçbir hakkı saklı değildir bukomik 1993 C</footer>

    <!-- Sayfa Geçişlerini Yöneten JavaScript -->
    <script>
        function showPage(pageId) {
            // Tüm sayfaları gizle
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => {
                page.classList.remove('active');
            });

            // Sadece tıklanan sayfayı göster
            const selectedPage = document.getElementById(pageId);
            if (selectedPage) {
                selectedPage.classList.add('active');
            }

            // Menü butonlarındaki aktiflik sınıfını güncelle
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => {
                btn.classList.remove('active');
            });
            
            const activeSubBtn = document.getElementById('btn-' + pageId);
            if (activeSubBtn) {
                activeSubBtn.classList.add('active');
            }
        }
    </script>

</body>
</html>
